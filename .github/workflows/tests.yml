name: Synthetic tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,data]'
      - run: python -m pytest -q
      - run: node --test tests/frontend_memory.test.cjs
      - run: node --test tests/frontend_issue_relations.test.cjs
      - run: node --test tests/frontend_investigation_usage.test.cjs
      - run: node --test tests/frontend_drafts.test.cjs
      - run: node --test tests/frontend_batches.test.cjs
      - run: node --test tests/frontend_readiness.test.cjs
      - run: node --test tests/frontend_preferences.test.cjs tests/frontend_repository.test.cjs tests/frontend_versions.test.cjs tests/frontend_evidence_graph.test.cjs tests/frontend_usage.test.cjs tests/frontend_resume.test.cjs tests/frontend_source_context.test.cjs tests/frontend_clarifications.test.cjs tests/frontend_adaptive_questions.test.cjs tests/frontend_report.test.cjs tests/frontend_releases.test.cjs tests/frontend_workflow.test.cjs tests/frontend_planned_waiting.test.cjs tests/frontend_typesafe.test.cjs tests/frontend_hypothesis_review.test.cjs tests/frontend_check_journal.test.cjs tests/frontend_product_checks.test.cjs tests/frontend_check_observations.test.cjs tests/frontend_finalization.test.cjs tests/frontend_dossier.test.cjs tests/frontend_handoff.test.cjs tests/frontend_claim_review.test.cjs tests/frontend_stage_recovery.test.cjs
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ISSUEINTEL_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m pytest tests/browser -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failures
          path: artifacts/browser-tests/
          retention-days: 7
          if-no-files-found: ignore
